<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎒 Tareas del Colegio</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef5ff, #fff7ed);
        color: #263238;
    }

    .login {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-box {
        background: white;
        width: 100%;
        max-width: 420px;
        padding: 35px;
        border-radius: 22px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        text-align: center;
    }

    .login-box h1 {
        margin-top: 0;
        font-size: 30px;
    }

    .login-box p {
        color: #666;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 2px solid #ddd;
        border-radius: 12px;
        font-size: 18px;
        margin: 10px 0;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 16px;
        cursor: pointer;
        background: #4f7cff;
        color: white;
        margin: 5px;
    }

    button:hover {
        opacity: 0.9;
    }

    .hidden {
        display: none;
    }

    .container {
        max-width: 1000px;
        margin: auto;
        padding: 25px;
    }

    header {
        background: white;
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        margin-bottom: 25px;
    }

    header h1 {
        margin: 0 0 8px;
        font-size: 32px;
    }

    .modo {
        color: #666;
    }

    .dias {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
    }

    .dia {
        background: white;
        border-radius: 18px;
        padding: 18px;
        min-height: 220px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .dia h2 {
        margin-top: 0;
        text-align: center;
        font-size: 21px;
    }

    .tarea {
        background: #f4f7ff;
        padding: 10px;
        border-radius: 10px;
        margin: 8px 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .tarea.completada {
        text-decoration: line-through;
        opacity: 0.5;
    }

    .tarea span {
        flex: 1;
    }

    .boton-eliminar {
        background: #ef5350;
        padding: 5px 8px;
        font-size: 12px;
    }

    .editor {
        background: white;
        padding: 20px;
        border-radius: 18px;
        margin-bottom: 25px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .editor h2 {
        margin-top: 0;
    }

    .editor select,
    .editor input {
        width: auto;
        min-width: 180px;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #ddd;
        font-size: 16px;
    }

    .cerrar {
        background: #777;
    }

    @media (max-width: 800px) {
        .dias {
            grid-template-columns: 1fr;
        }

        .dia {
            min-height: auto;
        }
    }
</style>
</head>

<body>

<!-- PANTALLA DE ACCESO -->
<div id="login" class="login">

    <div class="login-box">

        <h1>🎒 Tareas del Colegio</h1>

        <p>Introduce tu código para entrar</p>

        <input
            type="password"
            id="codigo"
            placeholder="Código"
            maxlength="10"
        >

        <button onclick="entrar()">
            ENTRAR
        </button>

        <p id="error" style="color:red;"></p>

    </div>

</div>


<!-- WEB -->
<div id="web" class="hidden">

    <div class="container">

        <header>

            <h1>🎒 TAREAS DEL COLEGIO</h1>

            <div id="modo" class="modo"></div>

            <button class="cerrar" onclick="cerrarSesion()">
                🔒 Cerrar sesión
            </button>

        </header>


        <!-- ZONA DE EDICIÓN -->
        <div id="editor" class="editor hidden">

            <h2>✏️ Modificar tareas</h2>

            <select id="dia">
                <option value="lunes">Lunes</option>
                <option value="martes">Martes</option>
                <option value="miercoles">Miércoles</option>
                <option value="jueves">Jueves</option>
                <option value="viernes">Viernes</option>
            </select>

            <input
                type="text"
                id="nuevaTarea"
                placeholder="Escribe una tarea..."
            >

            <button onclick="agregarTarea()">
                ➕ Añadir tarea
            </button>

        </div>


        <!-- TAREAS -->
        <div class="dias">

            <div class="dia">
                <h2>📘 Lunes</h2>
                <div id="lunes"></div>
            </div>

            <div class="dia">
                <h2>📗 Martes</h2>
                <div id="martes"></div>
            </div>

            <div class="dia">
                <h2>📕 Miércoles</h2>
                <div id="miercoles"></div>
            </div>

            <div class="dia">
                <h2>📙 Jueves</h2>
                <div id="jueves"></div>
            </div>

            <div class="dia">
                <h2>📒 Viernes</h2>
                <div id="viernes"></div>
            </div>

        </div>

    </div>

</div>


<script>

const CODIGO_VER = "1234";
const CODIGO_EDITAR = "9876";

let modoEdicion = false;


/* TAREAS INICIALES */

let tareas = JSON.parse(localStorage.getItem("tareasColegio")) || {

    lunes: [
        "Excursión"
    ],

    martes: [
        "Hacer proyecto de Sociales: Napoleón"
    ],

    miercoles: [],

    jueves: [],

    viernes: []

};


/* ENTRAR */

function entrar() {

    const codigo = document.getElementById("codigo").value;

    if (codigo === CODIGO_VER) {

        modoEdicion = false;
        mostrarWeb();

    }

    else if (codigo === CODIGO_EDITAR) {

        modoEdicion = true;
        mostrarWeb();

    }

    else {

        document.getElementById("error").textContent =
            "❌ Código incorrecto";

    }

}


/* MOSTRAR WEB */

function mostrarWeb() {

    document.getElementById("login").classList.add("hidden");

    document.getElementById("web").classList.remove("hidden");

    if (modoEdicion) {

        document.getElementById("modo").textContent =
            "✏️ Modo edición";

        document.getElementById("editor").classList.remove("hidden");

    }

    else {

        document.getElementById("modo").textContent =
            "👀 Solo lectura";

        document.getElementById("editor").classList.add("hidden");

    }

    mostrarTareas();

}


/* MOSTRAR TAREAS */

function mostrarTareas() {

    const dias = [
        "lunes",
        "martes",
        "miercoles",
        "jueves",
        "viernes"
    ];

    dias.forEach(dia => {

        const contenedor = document.getElementById(dia);

        contenedor.innerHTML = "";

        if (tareas[dia].length === 0) {

            contenedor.innerHTML =
                "<p style='text-align:center;color:#aaa;'>Sin tareas</p>";

        }

        tareas[dia].forEach((tarea, indice) => {

            const div = document.createElement("div");

            div.className = "tarea";

            div.innerHTML = `
                <input
                    type="checkbox"
                    onchange="completarTarea('${dia}', ${indice})"
                >

                <span>${escapeHTML(tarea)}</span>

                ${
                    modoEdicion
                    ?
                    `<button
                        class="boton-eliminar"
                        onclick="eliminarTarea('${dia}', ${indice})">
                        🗑️
                    </button>`
                    :
                    ""
                }
            `;

            contenedor.appendChild(div);

        });

    });

}


/* AÑADIR */

function agregarTarea() {

    const dia = document.getElementById("dia").value;

    const texto = document
        .getElementById("nuevaTarea")
        .value
        .trim();

    if (texto === "") {

        alert("Escribe una tarea.");

        return;

    }

    tareas[dia].push(texto);

    guardar();

    document.getElementById("nuevaTarea").value = "";

    mostrarTareas();

}


/* ELIMINAR */

function eliminarTarea(dia, indice) {

    if (confirm("¿Quieres eliminar esta tarea?")) {

        tareas[dia].splice(indice, 1);

        guardar();

        mostrarTareas();

    }

}


/* COMPLETAR */

function completarTarea(dia, indice) {

    guardar();

}


/* GUARDAR */

function guardar() {

    localStorage.setItem(
        "tareasColegio",
        JSON.stringify(tareas)
    );

}


/* CERRAR SESIÓN */

function cerrarSesion() {

    document.getElementById("web").classList.add("hidden");

    document.getElementById("login").classList.remove("hidden");

    document.getElementById("codigo").value = "";

}


/* SEGURIDAD BÁSICA PARA TEXTO */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
