<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎒 Tareas del Colegio</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eaf3ff, #fff7ed);
    color: #263238;
}

.login {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: white;
    width: 100%;
    max-width: 420px;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(0,0,0,.15);
    text-align: center;
}

.login-box h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.login-box p {
    color: #777;
}

.login-box input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 18px;
    margin: 15px 0;
    text-align: center;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 16px;
    cursor: pointer;
    background: #4d7cff;
    color: white;
}

button:hover {
    opacity: .88;
}

.hidden {
    display: none !important;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px;
}

header {
    background: white;
    padding: 25px;
    border-radius: 22px;
    box-shadow: 0 6px 25px rgba(0,0,0,.08);
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

#modo {
    margin-top: 10px;
    color: #777;
}

.cerrar {
    background: #777;
    margin-top: 15px;
}

.editor {
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

.editor h2 {
    margin-top: 0;
}

.editor select,
.editor input {
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin: 5px;
}

.dias {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
}

.dia {
    background: white;
    border-radius: 20px;
    padding: 18px;
    min-height: 220px;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
}

.dia h2 {
    text-align: center;
    margin-top: 0;
    font-size: 21px;
}

.tarea {
    background: #f3f6ff;
    border-radius: 12px;
    padding: 11px;
    margin: 9px 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tarea span {
    flex: 1;
}

.tarea.completada span {
    text-decoration: line-through;
    opacity: .5;
}

.eliminar {
    background: #ef5350;
    padding: 6px 9px;
    font-size: 12px;
}

.sin-tareas {
    text-align: center;
    color: #aaa;
}

@media(max-width:850px) {

    .dias {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>


<!-- LOGIN -->

<div id="login" class="login">

    <div class="login-box">

        <h1>🎒 Tareas del Colegio</h1>

        <p>Introduce tu código</p>

        <input
            id="codigo"
            type="password"
            placeholder="Código"
        >

        <button onclick="entrar()">
            ENTRAR
        </button>

        <p id="error"></p>

    </div>

</div>


<!-- WEB -->

<div id="web" class="hidden">

<div class="container">


<header>

    <h1>🎒 TAREAS DEL COLEGIO</h1>

    <div id="modo"></div>

    <button class="cerrar" onclick="cerrarSesion()">
        🔒 Cerrar sesión
    </button>

</header>


<!-- EDITOR -->

<div id="editor" class="editor hidden">

    <h2>✏️ Añadir tarea</h2>

    <select id="diaSeleccionado">

        <option value="lunes">Lunes</option>
        <option value="martes">Martes</option>
        <option value="miercoles">Miércoles</option>
        <option value="jueves">Jueves</option>
        <option value="viernes">Viernes</option>

    </select>

    <input
        id="textoTarea"
        type="text"
        placeholder="Escribe la tarea"
    >

    <button onclick="anadirTarea()">
        ➕ Añadir
    </button>

    <p>
        ⚠️ Los cambios hechos aquí son solo para este navegador.
        Para que los vea todo el mundo, cambia la sección
        <b>TAREAS</b> del código y haz Commit en GitHub.
    </p>

</div>


<!-- DÍAS -->

<div class="dias">

    <div class="dia">

        <h2>📘 Lunes</h2>

        <div id="lunes"></div>

    </div>


    <div class="dia">

        <h2>📗 Martes</h2>

        <div id="martes"></div>

    </div>


    <div class="dia">

        <h2>📕 Miércoles</h2>

        <div id="miercoles"></div>

    </div>


    <div class="dia">

        <h2>📙 Jueves</h2>

        <div id="jueves"></div>

    </div>


    <div class="dia">

        <h2>📒 Viernes</h2>

        <div id="viernes"></div>

    </div>

</div>

</div>

</div>


<script>


/* =========================================================
   🔐 CÓDIGOS
   ========================================================= */

const CODIGO_VER = "1234";

const CODIGO_EDITAR = "9876";


/* =========================================================
   🎒 TAREAS
   =========================================================
   
   ⭐ ESTA ES LA PARTE QUE PUEDES CAMBIAR EN GITHUB ⭐

   Ejemplo:

   lunes: [
       "Excursión",
       "Estudiar matemáticas"
   ]

   ========================================================= */

let tareas = {

    lunes: [
        "Excursión"
    ],

    martes: [
        "Hacer proyecto de Sociales: Napoleón"
    ],

    miercoles: [

    ],

    jueves: [

    ],

    viernes: [

    ]

};


/* =========================================================
   VARIABLES
   ========================================================= */

let modoEdicion = false;


/* =========================================================
   ENTRAR
   ========================================================= */

function entrar() {

    let codigo =
        document.getElementById("codigo").value.trim();

    if (codigo === CODIGO_VER) {

        modoEdicion = false;

        mostrarWeb();

    }

    else if (codigo === CODIGO_EDITAR) {

        modoEdicion = true;

        mostrarWeb();

    }

    else {

        document.getElementById("error").textContent =
            "❌ Código incorrecto";

    }

}


/* =========================================================
   MOSTRAR WEB
   ========================================================= */

function mostrarWeb() {

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("web")
        .classList.remove("hidden");


    if (modoEdicion) {

        document
            .getElementById("modo")
            .textContent =
            "✏️ Modo modificación";

        document
            .getElementById("editor")
            .classList.remove("hidden");

    }

    else {

        document
            .getElementById("modo")
            .textContent =
            "👀 Solo lectura";

        document
            .getElementById("editor")
            .classList.add("hidden");

    }


    mostrarTareas();

}


/* =========================================================
   MOSTRAR TAREAS
   ========================================================= */

function mostrarTareas() {

    const dias = [
        "lunes",
        "martes",
        "miercoles",
        "jueves",
        "viernes"
    ];


    dias.forEach(function(dia) {

        const contenedor =
            document.getElementById(dia);

        contenedor.innerHTML = "";


        if (tareas[dia].length === 0) {

            contenedor.innerHTML =
                '<div class="sin-tareas">Sin tareas</div>';

            return;

        }


        tareas[dia].forEach(function(tarea, indice) {

            const div =
                document.createElement("div");

            div.className = "tarea";


            div.innerHTML = `

                <input
                    type="checkbox"
                    onchange="completar(this)"
                >

                <span>
                    ${escapar(tarea)}
                </span>

                ${
                    modoEdicion
                    ?
                    `
                    <button
                        class="eliminar"
                        onclick="eliminarTarea('${dia}', ${indice})"
                    >
                        🗑️
                    </button>
                    `
                    :
                    ""
                }

            `;


            contenedor.appendChild(div);

        });

    });

}


/* =========================================================
   AÑADIR TAREA
   ========================================================= */

function anadirTarea() {

    let dia =
        document.getElementById("diaSeleccionado").value;

    let texto =
        document
        .getElementById("textoTarea")
        .value
        .trim();


    if (texto === "") {

        alert("Escribe una tarea.");

        return;

    }


    tareas[dia].push(texto);


    document
        .getElementById("textoTarea")
        .value = "";


    mostrarTareas();

}


/* =========================================================
   ELIMINAR
   ========================================================= */

function eliminarTarea(dia, indice) {

    if (
        confirm("¿Quieres eliminar esta tarea?")
    ) {

        tareas[dia].splice(indice, 1);

        mostrarTareas();

    }

}


/* =========================================================
   COMPLETAR
   ========================================================= */

function completar(casilla) {

    const tarea =
        casilla.parentElement;

    if (casilla.checked) {

        tarea.classList.add("completada");

    }

    else {

        tarea.classList.remove("completada");

    }

}


/* =========================================================
   CERRAR SESIÓN
   ========================================================= */

function cerrarSesion() {

    document
        .getElementById("web")
        .classList.add("hidden");

    document
        .getElementById("login")
        .classList.remove("hidden");

    document
        .getElementById("codigo")
        .value = "";

}


/* =========================================================
   SEGURIDAD DEL TEXTO
   ========================================================= */

function escapar(texto) {

    const elemento =
        document.createElement("div");

    elemento.textContent = texto;

    return elemento.innerHTML;

}

</script>

</body>
</html>
